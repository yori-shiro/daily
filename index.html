<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>記録</title>
<style>
  :root{
    color-scheme:light;
    --bg:#F1F0F4;
    --card:#FFFFFF;
    --ink:#23252E;
    --ink2:#646877;
    --ink3:#9A9DA8;
    --line:#E3E2E8;
    --rail:#D8D6E0;
    --accent:#5C5A72;
    --accent-pale:#EDECF2;
    --minus:#A4564E;
    --minus-pale:#F7EDEC;
    --neutral:#8B8E99;
    --neutral-pale:#F0F0F2;
    --plus:#5B7C60;
    --plus-pale:#EDF2EE;
    --warn-bg:#FBF1E6;
    --warn-ink:#8F6528;
    --radius:12px;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    max-width:480px;margin:0 auto;min-height:100vh;
    padding-bottom:96px;
    -webkit-text-size-adjust:100%;
  }
  button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit;}
  .mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
  .cap{font-size:.68rem;letter-spacing:.14em;color:var(--ink3);}

  /* ---------- gate ---------- */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;}
  #gate.on{display:flex;}
  #gate .dots{display:flex;gap:12px;}
  #gate .dot{width:12px;height:12px;border-radius:50%;background:var(--rail);}
  #gate .dot.f{background:var(--accent);}
  #gate .pad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
  #gate .pad button{height:56px;border:1px solid var(--line);background:var(--card);
    border-radius:12px;font-size:1.2rem;}
  #gate .msg{font-size:.82rem;color:var(--ink2);height:1.2em;}

  /* ---------- header ---------- */
  header{background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;padding:10px 14px 0;}
  .hrow{display:flex;align-items:center;gap:8px;}
  .hrow .nav{border:none;background:none;color:var(--ink2);font-size:1.1rem;
    width:34px;height:34px;border-radius:9px;}
  .hrow .nav:active{background:var(--accent-pale);}
  .dwrap{flex:1;text-align:center;line-height:1.15;}
  .dwrap .dnum{font-size:1.35rem;letter-spacing:.02em;}
  .dwrap .dsub{font-size:.7rem;color:var(--ink3);letter-spacing:.1em;}
  .htools{display:flex;gap:6px;}
  .htools button{border:none;background:none;color:var(--ink3);font-size:.95rem;
    width:32px;height:32px;border-radius:9px;}
  .htools button:active{background:var(--accent-pale);}
  #datePick{position:absolute;opacity:0;width:1px;height:1px;}

  .strip{display:flex;gap:6px;overflow-x:auto;padding:9px 0 10px;
    scrollbar-width:none;}
  .strip::-webkit-scrollbar{display:none;}
  .pill{flex:0 0 auto;font-size:.7rem;padding:3px 9px;border-radius:99px;
    background:var(--neutral-pale);color:var(--ink2);white-space:nowrap;}
  .pill.m{background:var(--minus-pale);color:var(--minus);}
  .pill.p{background:var(--plus-pale);color:var(--plus);}
  .pill.none{background:none;color:var(--ink3);padding-left:2px;}

  /* ---------- storage note ---------- */
  #storNote{display:none;margin:10px 14px 0;padding:9px 11px;border-radius:10px;
    background:var(--warn-bg);color:var(--warn-ink);font-size:.76rem;line-height:1.5;}
  #storNote.on{display:block;}

  /* ---------- 在宅パターン ---------- */
  .pres{display:flex;gap:5px;padding:0 0 10px;}
  .pres button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;
    padding:6px 2px;font-size:.66rem;color:var(--ink2);line-height:1.35;}
  .pres button.on{border-color:var(--accent);background:var(--accent);color:#fff;}
  .pres button .fig{display:block;font-size:.82rem;letter-spacing:.06em;margin-bottom:1px;}

  /* ---------- day sheet ---------- */
  main{padding:12px 14px 0;}
  .band{display:grid;grid-template-columns:52px 1fr;gap:10px;
    border-left:0;position:relative;}
  .band + .band{margin-top:2px;}
  .bandlab{padding-top:9px;text-align:right;position:relative;}
  .bandlab .bn{font-size:.76rem;color:var(--ink2);}
  .bandlab .bt{font-size:.6rem;color:var(--ink3);display:block;margin-top:1px;}
  .band.empty .bandlab .bn{color:var(--ink3);}
  .bandbody{border-left:2px solid var(--rail);padding:6px 0 6px 12px;min-height:26px;}
  .band.empty .bandbody{border-left-color:var(--line);min-height:14px;padding:2px 0 2px 12px;}
  .band.has .bandbody{border-left-color:var(--accent);}

  .rec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:9px 11px;margin-bottom:6px;}
  .rec .top{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
  .rec .cdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .rec .cname{font-size:.72rem;color:var(--ink2);}
  .rec .tm{font-size:.72rem;color:var(--ink3);margin-left:auto;}
  .rec .fact{font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .rec .quote{margin-top:5px;padding:6px 9px;border-left:2px solid var(--rail);
    font-size:.83rem;color:var(--ink);line-height:1.5;background:var(--neutral-pale);
    border-radius:0 8px 8px 0;white-space:pre-wrap;word-break:break-word;}
  .rec .sub{margin-top:5px;font-size:.78rem;color:var(--ink2);line-height:1.5;
    white-space:pre-wrap;word-break:break-word;}
  .rec .sub b{font-weight:normal;color:var(--ink3);font-size:.7rem;margin-right:5px;}
  .rec .marks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .mk{font-size:.66rem;padding:2px 7px;border-radius:99px;background:var(--neutral-pale);color:var(--ink2);}
  .mk.m{background:var(--minus-pale);color:var(--minus);}
  .mk.p{background:var(--plus-pale);color:var(--plus);}
  .mk.g{background:none;border:1px dashed var(--rail);color:var(--ink3);}
  .rec .live{margin-top:7px;}
  .rec .live button{border:1px solid var(--accent);background:var(--card);color:var(--accent);
    font-size:.74rem;padding:5px 12px;border-radius:99px;}

  .daynote{margin:16px 0 8px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:11px 12px;}
  .daynote .lab{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .daynote textarea{width:100%;border:none;resize:vertical;min-height:60px;
    font-size:.88rem;line-height:1.6;outline:none;background:none;}
  .daynote .save{font-size:.72rem;color:var(--ink3);margin-left:auto;}

  .emptyday{text-align:center;color:var(--ink3);font-size:.8rem;padding:26px 0 6px;}

  /* ---------- quickbar ---------- */
  #quickbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:30;}
  #quickbar .qs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;}
  #quickbar .qs::-webkit-scrollbar{display:none;}
  .qbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    border-radius:99px;padding:8px 13px;font-size:.78rem;display:flex;align-items:center;gap:6px;}
  .qbtn:active{background:var(--accent-pale);}
  .qbtn .cdot{width:7px;height:7px;border-radius:50%;}
  .qbtn.plus{border-style:dashed;color:var(--ink2);}

  /* ---------- sheet ---------- */
  #veil{position:fixed;inset:0;background:rgba(20,20,28,.34);z-index:40;display:none;}
  #veil.on{display:block;}
  #sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;
    width:100%;max-width:480px;background:var(--bg);z-index:50;
    border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;display:none;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));}
  #sheet.on{display:block;}
  .shead{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;
    display:flex;align-items:center;gap:10px;z-index:2;}
  .shead h2{font-size:.98rem;font-weight:600;}
  .shead .x{margin-left:auto;border:none;background:none;color:var(--ink3);
    font-size:1.15rem;width:32px;height:32px;border-radius:9px;}
  .sec{padding:0 16px 14px;}
  .sec > label,.seclab{display:block;font-size:.73rem;color:var(--ink2);margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:99px;
    padding:7px 13px;font-size:.8rem;color:var(--ink2);}
  .chip.on{border-color:var(--accent);background:var(--accent);color:#fff;}
  .chip.sm{padding:5px 11px;font-size:.75rem;}
  .chip.ev-m.on{border-color:var(--minus);background:var(--minus);}
  .chip.ev-n.on{border-color:var(--neutral);background:var(--neutral);}
  .chip.ev-p.on{border-color:var(--plus);background:var(--plus);}
  .chip .bt{font-size:.62rem;opacity:.7;display:block;margin-top:1px;}
  textarea.fld,input.fld,select.fld{width:100%;border:1px solid var(--line);
    background:var(--card);border-radius:10px;padding:10px 11px;font-size:.9rem;
    line-height:1.55;outline:none;}
  textarea.fld{resize:vertical;min-height:76px;}
  textarea.fld:focus,input.fld:focus{border-color:var(--accent);}
  .hint{font-size:.7rem;color:var(--ink3);margin-top:5px;line-height:1.5;}
  .row2{display:flex;gap:8px;}
  .row2 > *{flex:1;}
  .check{display:flex;align-items:center;gap:9px;font-size:.82rem;color:var(--ink2);
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;}
  .check input{width:18px;height:18px;accent-color:var(--accent);}
  .foldlab{display:flex;align-items:center;gap:6px;font-size:.73rem;color:var(--ink2);
    padding:9px 0;cursor:pointer;}
  .foldlab .ar{font-size:.6rem;color:var(--ink3);}
  .fold[hidden]{display:none;}
  .acts{padding:4px 16px 0;display:flex;gap:9px;}
  .btn{flex:1;border:none;border-radius:12px;padding:13px;font-size:.92rem;
    background:var(--accent);color:#fff;}
  .btn.sub{background:var(--card);color:var(--ink2);border:1px solid var(--line);}
  .btn.dgr{background:var(--card);color:var(--minus);border:1px solid var(--minus);}
  .btn:disabled{opacity:.4;}
  .meta{padding:12px 16px 0;font-size:.68rem;color:var(--ink3);line-height:1.6;}

  /* ---------- settings list ---------- */
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .li{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);
    font-size:.86rem;}
  .li:last-child{border-bottom:none;}
  .li .grow{flex:1;}
  .li .mini{font-size:.68rem;color:var(--ink3);display:block;margin-top:2px;}
  .li button{border:none;background:none;color:var(--ink3);font-size:.75rem;padding:6px 8px;}
  .li button.del{color:var(--minus);}

  #toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(14px);
    background:var(--ink);color:#fff;font-size:.8rem;padding:9px 16px;border-radius:99px;
    opacity:0;transition:.22s;z-index:100;pointer-events:none;max-width:88%;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="gate">
  <div class="cap">パスコード</div>
  <div class="dots" id="gDots"></div>
  <div class="msg" id="gMsg"></div>
  <div class="pad" id="gPad"></div>
</div>

<header>
  <div class="hrow">
    <button class="nav" id="prevDay" aria-label="前の日">‹</button>
    <div class="dwrap">
      <div class="dnum mincho" id="dNum">—</div>
      <div class="dsub" id="dSub"></div>
    </div>
    <button class="nav" id="nextDay" aria-label="次の日">›</button>
    <div class="htools">
      <button id="openCal" aria-label="日付を選ぶ">▤</button>
      <button id="openSet" aria-label="設定">⚙</button>
    </div>
    <input type="date" id="datePick">
  </div>
  <div class="strip" id="strip"></div>
</header>

<div id="storNote"></div>

<main>
  <div class="pres" id="pres"></div>
  <div id="sheetBody"></div>
  <div class="daynote">
    <div class="lab"><span class="cap">この日のまとめ</span><span class="save" id="noteSave"></span></div>
    <textarea id="dayNote" placeholder="一日を通しての流れや、項目に収まらないことを書き足せる。"></textarea>
  </div>
</main>

<div id="quickbar"><div class="qs" id="qs"></div></div>

<div id="veil"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* =========================================================
   記録  —  日々の観察を1日1枚のシートに残すためのアプリ

   設計上の約束（改修するときはここを先に読むこと）
   ・データは端末内のみ。外部通信は一切なし。
   ・画面組み立ては innerHTML。流し込む値が「コード内の固定値」か
     「利用者が入れたデータ」かを必ず区別し、後者は esc() を通す。
   ・保存関数は成否を返す。呼び出し側はそれを見て文言を変える。
     「保存した」と言えるのは、端末に書けたときだけ。
   ・書き込みに失敗したら STORE を memory に落とし、警告を出したままにする。
   ・破壊的な操作を途中で中止するかどうかは、操作を「始める前」の
     persistent() で決める。degraded フラグは警告を一度だけ出すためのもので、
     成否の判定には絶対に使わない。操作の途中で立つので判定が揺れる。
   ・JSONの読み込みは「検証 → 控えを書き出す → 新データを書く →
     余った古い日付だけ消す」の順。検証を通らないものは書き込まない。
   ・version は移行のための番号。形を変えるときは必ず上げる。

   既知の限界
   ・書き込みも読み出しも成功するのに、閉じると領域ごと消える環境がある
     （プレビュー等）。セッション内では検出できない。公開した場所から
     開くことで回避する。置き場所からの推定で注意書きだけ出している。
   ・読み込みの前に控えをダウンロードするが、ブラウザが実際にファイルを
     保存し終えたかどうかは、こちらからは確認できない。
   ・sDel() は削除の失敗を返さない。ただし削除は「新データを書けたあと」に
     しか走らないので、失敗しても古いデータが残るだけで、失われはしない。
   ・パスコードは暗号化ではない。目隠しであって錠前ではない。
   ========================================================= */

/* ---------- 時間帯の定義 ---------- */
const BANDS = [
  {k:"morning", n:"朝",   t:"〜9",    from:5,  to:9},
  {k:"am",      n:"午前", t:"9–12",   from:9,  to:12},
  {k:"noon",    n:"昼",   t:"12–14",  from:12, to:14},
  {k:"pm",      n:"午後", t:"14–16",  from:14, to:16},
  {k:"eve",     n:"夕方", t:"16–19",  from:16, to:19},
  {k:"night",   n:"夜",   t:"19–24",  from:19, to:24},
  {k:"late",    n:"深夜", t:"0–5",    from:0,  to:5}
];
const BANDNAME = Object.fromEntries(BANDS.map(b=>[b.k,b.n]));
const COUNTS = ["1回","2〜3回","4〜5回","それ以上"];
const DURS   = ["数分","10分前後","15分前後","30分程度","1時間前後","数時間","ほぼ一日中"];
const EVALS  = [{k:"minus",n:"マイナス",c:"ev-m"},{k:"neutral",n:"中立",c:"ev-n"},{k:"plus",n:"プラス",c:"ev-p"}];
const PALETTE = ["#5C5A72","#A4564E","#5B7C60","#4A7192","#8A6D3B","#7A5A78","#3F7C7A","#8B8E99"];
/* その日の基本形。日中の出入りは「外出」の記録で拾う。 */
const PRESENCE = [
  {k:"both",   fig:"● ●", n:"二人とも在宅"},
  {k:"meOnly", fig:"● ○", n:"自分だけ在宅"},
  {k:"themOnly",fig:"○ ●", n:"相手だけ在宅"},
  {k:"none",   fig:"○ ○", n:"二人とも不在"}
];
const PRESNAME = Object.fromEntries(PRESENCE.map(p=>[p.k,p.n]));

/* ---------- storage（三段構え） ----------
   保存の成否は必ず呼び出し側に返す。書き込みに失敗したら
   STORE を "memory" に落として、画面に警告を出したまま使わせる。
   ※ 検出できない失敗の型がひとつある。書き込みも読み出しも成功するのに
     アプリを閉じると領域ごと消える環境（プレビュー等）がそれで、
     セッション内では判定できない。公開した場所から開くことで回避する。   */
let STORE = null, mem = {}, degraded = false;
function showStorNote(text){
  const n = document.getElementById("storNote");
  if(!n) return;
  n.textContent = text;
  n.classList.add("on");
}
function degrade(){
  if(degraded) return;
  degraded = true;
  STORE = "memory";
  showStorNote("端末への保存に失敗した。ここから先の記録は画面を閉じると失われる。設定からJSONを書き出して控えを取ってほしい。");
}
/* 破壊的な操作の可否は、この関数を「操作を始める前」に呼んで判断する。
   操作の途中で degrade() が起きても判定が揺れないようにするため。
   degraded フラグは成否判定には使わないこと。 */
function persistent(){ return STORE === "artifact" || STORE === "local"; }
async function initStorage(){
  try{
    if(window.storage && typeof window.storage.set === "function"){
      await window.storage.set("__probe__", "1");
      const r = await window.storage.get("__probe__");
      if(r && r.value === "1"){ STORE = "artifact"; return; }
    }
  }catch(e){}
  try{
    localStorage.setItem("__probe__","1");
    if(localStorage.getItem("__probe__") === "1"){
      localStorage.removeItem("__probe__");
      STORE = "local"; return;
    }
  }catch(e){}
  STORE = "memory";
}
async function sGet(key){
  try{
    if(STORE === "artifact"){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
    if(STORE === "local"){ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  }catch(e){ return mem[key] ?? null; }
  return mem[key] ?? null;
}
/* 戻り値：true=端末に保存できた / false=メモリ上にしかない */
async function sSet(key,val){
  const s = JSON.stringify(val);
  if(STORE === "artifact" || STORE === "local"){
    try{
      if(STORE === "artifact") await window.storage.set(key,s);
      else localStorage.setItem(key,s);
      mem[key] = val;
      return true;
    }catch(e){
      degrade();
    }
  }
  mem[key] = val;
  return false;
}
async function sKeys(prefix){
  try{
    if(STORE === "artifact"){ const r = await window.storage.list(prefix); return (r && r.keys) || []; }
    if(STORE === "local"){
      const out = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(prefix)) out.push(k);
      }
      return out;
    }
  }catch(e){}
  return Object.keys(mem).filter(k=>k.startsWith(prefix));
}
async function sDel(key){
  try{
    if(STORE === "artifact"){ await window.storage.delete(key); return; }
    if(STORE === "local"){ localStorage.removeItem(key); return; }
  }catch(e){}
  delete mem[key];
}

/* ---------- utils ---------- */
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function ymd(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseYmd(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); }
function shiftDay(s,n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function nowBand(){
  const h = new Date().getHours();
  const b = BANDS.find(x => h >= x.from && h < x.to);
  return b ? b.k : "late";
}
function hhmm(dt){ return String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0"); }
function fmtStamp(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " + hhmm(d);
}
/* 深夜帯は前日の続きとして扱うため、5時前は既定の日付を前日にする */
function defaultDate(){
  const d = new Date();
  if(d.getHours() < 5) d.setDate(d.getDate()-1);
  return ymd(d);
}

/* ---------- state ---------- */
let cats = [];
let settings = { passcode:null };
let curDate = defaultDate();
let day = { note:"", presence:null, records:[] };
let draft = null;

const DKEY = d => "log:day:" + d;

/* ---------- load / save ---------- */
async function loadCats(){ cats = (await sGet("log:cats")) || []; }
async function saveCats(){ return await sSet("log:cats", cats); }
async function loadSettings(){ settings = (await sGet("log:settings")) || { passcode:null }; }
async function saveSettings(){ return await sSet("log:settings", settings); }
async function loadDay(){
  day = (await sGet(DKEY(curDate))) || { note:"", presence:null, records:[] };
  if(!("presence" in day)) day.presence = null;
  render();
}
async function saveDay(){ return await sSet(DKEY(curDate), day); }
/* 保存結果を一言に変える。端末に残らなかった場合は必ずそう言う。 */
function saveMsg(ok, doneText){
  return ok ? doneText : "端末に保存できなかった。閉じると消える。";
}

/* ---------- render ---------- */
function catOf(id){ return cats.find(c=>c.id===id) || {name:"（未分類）", color:"#8B8E99", tags:[]}; }

function render(){
  const d = parseYmd(curDate);
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  document.getElementById("dNum").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日";
  document.getElementById("dSub").textContent = d.getFullYear() + "  " + w + "曜";
  document.getElementById("datePick").value = curDate;
  drawPresence();
  drawStrip();
  drawSheet();
  document.getElementById("dayNote").value = day.note || "";
  document.getElementById("noteSave").textContent = "";
}

function drawPresence(){
  let h = "";
  PRESENCE.forEach(p=>{
    h += '<button data-pr="' + p.k + '" class="' + (day.presence === p.k ? "on" : "") + '">'
       + '<span class="fig">' + p.fig + "</span>" + p.n + "</button>";
  });
  document.getElementById("pres").innerHTML = h;
}

function drawStrip(){
  const el = document.getElementById("strip");
  const recs = day.records;
  const pres = day.presence ? '<span class="pill">' + esc(PRESNAME[day.presence]) + "</span>" : "";
  if(!recs.length){ el.innerHTML = pres + '<span class="pill none">記録なし</span>'; return; }
  const byCat = {};
  let m=0,p=0;
  recs.forEach(r=>{
    byCat[r.catId] = (byCat[r.catId]||0) + 1;
    if(r.eval==="minus") m++;
    if(r.eval==="plus") p++;
  });
  let h = pres;
  Object.keys(byCat).forEach(id=>{
    const c = catOf(id);
    h += '<span class="pill">' + esc(c.name) + " " + byCat[id] + "</span>";
  });
  if(m) h += '<span class="pill m">マイナス ' + m + "</span>";
  if(p) h += '<span class="pill p">プラス ' + p + "</span>";
  el.innerHTML = h;
}

function drawSheet(){
  const host = document.getElementById("sheetBody");
  if(!day.records.length){
    host.innerHTML = '<div class="emptyday">この日はまだ記録がない。<br>下のボタンから書き始められる。</div>';
    return;
  }
  let h = "";
  BANDS.forEach(b=>{
    const rs = day.records
      .filter(r => r.band === b.k)
      .sort((x,y) => (x.time||"99:99").localeCompare(y.time||"99:99"));
    const has = rs.length > 0;
    h += '<div class="band ' + (has ? "has" : "empty") + '">';
    h += '<div class="bandlab"><span class="bn">' + b.n + '</span><span class="bt">' + b.t + '</span></div>';
    h += '<div class="bandbody">';
    rs.forEach(r => { h += recHtml(r); });
    h += "</div></div>";
  });
  host.innerHTML = h;
}

function recHtml(r){
  const c = catOf(r.catId);
  let h = '<div class="rec" data-id="' + esc(r.id) + '">';
  h += '<div class="top"><span class="cdot" style="background:' + esc(c.color) + '"></span>';
  h += '<span class="cname">' + esc(c.name) + "</span>";
  if(r.time) h += '<span class="tm">' + esc(r.time) + "</span>";
  h += "</div>";
  if(r.fact) h += '<div class="fact">' + esc(r.fact) + "</div>";
  if(r.quote) h += '<div class="quote">' + esc(r.quote) + "</div>";
  if(r.impact) h += '<div class="sub"><b>影響</b>' + esc(r.impact) + "</div>";
  if(r.feel) h += '<div class="sub"><b>所感</b>' + esc(r.feel) + "</div>";
  const marks = [];
  (r.tags||[]).forEach(t => marks.push('<span class="mk">' + esc(t) + "</span>"));
  if(r.count) marks.push('<span class="mk">' + esc(r.count) + "</span>");
  if(r.dur) marks.push('<span class="mk">' + esc(r.dur) + "</span>");
  if(r.guess) marks.push('<span class="mk g">推測</span>');
  if(r.eval === "minus") marks.push('<span class="mk m">マイナス</span>');
  if(r.eval === "plus") marks.push('<span class="mk p">プラス</span>');
  if(r.movedFromLate) marks.push('<span class="mk g">深夜（翌日付け）</span>');
  if(marks.length) h += '<div class="marks">' + marks.join("") + "</div>";
  if(r.startAt && !r.endAt){
    h += '<div class="live"><button data-stop="' + esc(r.id) + '">戻ってきた</button></div>';
  }
  h += "</div>";
  return h;
}

function drawQuick(){
  let h = "";
  cats.forEach(c=>{
    h += '<button class="qbtn" data-cat="' + esc(c.id) + '"><span class="cdot" style="background:'
       + esc(c.color) + '"></span>' + esc(c.name) + "</button>";
  });
  h += '<button class="qbtn plus" data-newcat="1">＋ 項目を追加</button>';
  document.getElementById("qs").innerHTML = h;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2000);
}

/* ---------- sheet（共通） ---------- */
function openSheet(html){
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("veil").classList.add("on");
  document.getElementById("sheet").scrollTop = 0;
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("veil").classList.remove("on");
  document.getElementById("sheet").innerHTML = "";
  draft = null;
}
document.getElementById("veil").addEventListener("click", closeSheet);

/* ---------- 記録の編集 ---------- */
function newDraft(catId){
  const now = new Date();
  return {
    id:uid(), band:nowBand(), time:hhmm(now), catId, tags:[],
    fact:"", quote:"", impact:"", feel:"",
    guess:false, eval:"neutral", count:null, dur:null,
    startAt:null, endAt:null, movedFromLate:false, nextDay:false,
    createdAt:new Date().toISOString(), editedAt:null, editCount:0,
    _isNew:true
  };
}

function openRecord(rec){
  draft = JSON.parse(JSON.stringify(rec));
  drawRecordSheet();
}

function drawRecordSheet(){
  const c = catOf(draft.catId);
  const isNew = !!draft._isNew;
  let h = "";
  h += '<div class="shead"><h2>' + esc(c.name) + (isNew ? " を記録" : " の記録") + "</h2>";
  h += '<button class="x" id="shX">✕</button></div>';

  /* 時間帯 */
  h += '<div class="sec"><span class="seclab">時間帯</span><div class="chips" id="bandChips">';
  BANDS.forEach(b=>{
    h += '<button class="chip sm' + (draft.band===b.k ? " on":"") + '" data-b="' + b.k + '">'
       + b.n + '<span class="bt">' + b.t + "</span></button>";
  });
  h += "</div>";
  if(draft.band === "late"){
    h += '<div style="margin-top:8px"><label class="check"><input type="checkbox" id="nextDayChk"'
       + (draft.nextDay ? " checked":"") + '>翌日の記録として付ける</label>'
       + '<div class="hint">深夜は既定でこの日の続きに入る。日付が変わってから起き出してきた場合だけ切り替える。</div></div>';
  }
  h += "</div>";

  /* 時刻 */
  h += '<div class="sec"><span class="seclab">時刻（分かる範囲でいい。空でも構わない）</span>';
  h += '<div class="row2"><input type="time" class="fld" id="fTime" value="' + esc(draft.time||"") + '">';
  h += '<button class="chip" id="clrTime" style="flex:0 0 auto">時刻なし</button></div></div>';

  /* タグ */
  if(c.tags && c.tags.length){
    h += '<div class="sec"><span class="seclab">内容（複数選べる）</span><div class="chips" id="tagChips">';
    c.tags.forEach(t=>{
      h += '<button class="chip sm' + ((draft.tags||[]).includes(t) ? " on":"") + '" data-t="'
         + esc(t) + '">' + esc(t) + "</button>";
    });
    h += "</div></div>";
  }

  /* 事実 */
  h += '<div class="sec"><span class="seclab">事実 — 見たこと・起きたこと</span>';
  h += '<textarea class="fld" id="fFact" placeholder="何があったかを、そのまま。">' + esc(draft.fact) + "</textarea>";
  h += '<div style="margin-top:8px"><label class="check"><input type="checkbox" id="fGuess"'
     + (draft.guess ? " checked":"") + '>見ていない／推測が含まれる</label></div></div>';

  /* 発言 */
  h += '<div class="sec"><span class="seclab">発言（言われた言葉をそのまま）</span>';
  h += '<textarea class="fld" id="fQuote" style="min-height:56px" placeholder="覚えている通りの言い回しで。">'
     + esc(draft.quote) + "</textarea></div>";

  /* 評価 */
  h += '<div class="sec"><span class="seclab">評価</span><div class="chips" id="evChips">';
  EVALS.forEach(e=>{
    h += '<button class="chip ' + e.c + (draft.eval===e.k ? " on":"") + '" data-e="' + e.k + '">' + e.n + "</button>";
  });
  h += '</div><div class="hint">守られたこと・改まったことも同じ形で残しておくと、あとで数えられる。</div></div>';

  /* 折りたたみ：量と補足 */
  const foldOpen = draft.count || draft.dur || draft.impact || draft.feel;
  h += '<div class="sec"><div class="foldlab" id="foldBtn"><span class="ar" id="foldAr">'
     + (foldOpen ? "▼" : "▶") + '</span>回数・所要時間・影響・所感</div>';
  h += '<div class="fold" id="foldBody"' + (foldOpen ? "" : " hidden") + ">";

  h += '<span class="seclab">回数</span><div class="chips" id="cntChips" style="margin-bottom:12px">';
  COUNTS.forEach(x=>{
    h += '<button class="chip sm' + (draft.count===x ? " on":"") + '" data-c="' + esc(x) + '">' + esc(x) + "</button>";
  });
  h += "</div>";

  h += '<span class="seclab">所要時間の目安</span><div class="chips" id="durChips" style="margin-bottom:12px">';
  DURS.forEach(x=>{
    h += '<button class="chip sm' + (draft.dur===x ? " on":"") + '" data-d="' + esc(x) + '">' + esc(x) + "</button>";
  });
  h += "</div>";

  h += '<span class="seclab">影響 — それで自分の側に何が起きたか</span>';
  h += '<textarea class="fld" id="fImpact" style="min-height:52px" placeholder="例：その間、洗濯を干せなかった。">'
     + esc(draft.impact) + "</textarea>";
  h += '<div style="height:12px"></div>';
  h += '<span class="seclab">所感 — そのとき自分がどう感じたか</span>';
  h += '<textarea class="fld" id="fFeel" style="min-height:52px" placeholder="事実とは分けて残しておける。">'
     + esc(draft.feel) + "</textarea>";
  h += "</div></div>";

  /* 計測 */
  if(c.measure){
    if(draft.startAt && !draft.endAt){
      h += '<div class="sec"><button class="btn sub" id="stopBtn">いま戻ってきた（所要時間を入れる）</button></div>';
    }else if(!draft.startAt){
      h += '<div class="sec"><button class="btn sub" id="startBtn">いま出て行った（時間を測り始める）</button>'
         + '<div class="hint">押した時刻を控えておいて、戻ってきたときにもう一度押すと所要時間が入る。</div></div>';
    }
  }

  /* 操作 */
  h += '<div class="acts">';
  h += '<button class="btn sub" id="cancelBtn">やめる</button>';
  h += '<button class="btn" id="saveBtn">保存</button></div>';
  if(!isNew){
    h += '<div class="acts" style="margin-top:9px"><button class="btn dgr" id="delBtn">この記録を削除</button></div>';
  }

  /* メタ */
  if(!isNew){
    let m = "記録した日時：" + fmtStamp(draft.createdAt);
    if(draft.editedAt) m += "<br>最終編集：" + fmtStamp(draft.editedAt) + "（" + draft.editCount + "回）";
    if(draft.startAt) m += "<br>開始の打刻：" + fmtStamp(draft.startAt);
    if(draft.endAt) m += "<br>終了の打刻：" + fmtStamp(draft.endAt);
    h += '<div class="meta">' + m + "</div>";
  }else{
    h += '<div class="meta">保存すると、記録した日時が自動で残る。あとから直した場合も編集の記録が残る。</div>';
  }

  openSheet(h);
  bindRecordSheet();
}

function bindRecordSheet(){
  const $ = id => document.getElementById(id);
  $("shX").onclick = closeSheet;
  $("cancelBtn").onclick = closeSheet;

  $("bandChips").onclick = e=>{
    const b = e.target.closest("[data-b]"); if(!b) return;
    syncFields();
    draft.band = b.dataset.b;
    if(draft.band !== "late") draft.nextDay = false;
    drawRecordSheet();
  };
  const nd = $("nextDayChk");
  if(nd) nd.onchange = () => { draft.nextDay = nd.checked; };

  $("clrTime").onclick = ()=>{ draft.time = ""; $("fTime").value = ""; };

  const tg = $("tagChips");
  if(tg) tg.onclick = e=>{
    const b = e.target.closest("[data-t]"); if(!b) return;
    const t = b.dataset.t;
    draft.tags = draft.tags || [];
    const i = draft.tags.indexOf(t);
    if(i >= 0) draft.tags.splice(i,1); else draft.tags.push(t);
    b.classList.toggle("on");
  };

  $("evChips").onclick = e=>{
    const b = e.target.closest("[data-e]"); if(!b) return;
    draft.eval = b.dataset.e;
    [...$("evChips").children].forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  };

  $("foldBtn").onclick = ()=>{
    const body = $("foldBody");
    body.hidden = !body.hidden;
    $("foldAr").textContent = body.hidden ? "▶" : "▼";
  };
  const cc = $("cntChips");
  if(cc) cc.onclick = e=>{
    const b = e.target.closest("[data-c]"); if(!b) return;
    draft.count = (draft.count === b.dataset.c) ? null : b.dataset.c;
    [...cc.children].forEach(x => x.classList.remove("on"));
    if(draft.count) b.classList.add("on");
  };
  const dc = $("durChips");
  if(dc) dc.onclick = e=>{
    const b = e.target.closest("[data-d]"); if(!b) return;
    draft.dur = (draft.dur === b.dataset.d) ? null : b.dataset.d;
    [...dc.children].forEach(x => x.classList.remove("on"));
    if(draft.dur) b.classList.add("on");
  };

  const sb = $("startBtn");
  if(sb) sb.onclick = ()=>{
    syncFields();
    draft.startAt = new Date().toISOString();
    draft.time = hhmm(new Date());
    draft.band = nowBand();
    saveRecord(true);
  };
  const eb = $("stopBtn");
  if(eb) eb.onclick = ()=>{ syncFields(); applyStop(draft); drawRecordSheet(); };

  $("saveBtn").onclick = ()=>{ syncFields(); saveRecord(false); };

  const db = $("delBtn");
  if(db){
    let armed = false;
    db.onclick = ()=>{
      if(!armed){ armed = true; db.textContent = "もう一度押すと削除される"; setTimeout(()=>{ armed=false; db.textContent="この記録を削除"; }, 4000); return; }
      day.records = day.records.filter(r => r.id !== draft.id);
      saveDay().then(ok=>{ closeSheet(); render(); toast(saveMsg(ok, "削除した")); });
    };
  }
}

function syncFields(){
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const v = g("fFact"); if(v !== undefined) draft.fact = v;
  const q = g("fQuote"); if(q !== undefined) draft.quote = q;
  const i = g("fImpact"); if(i !== undefined) draft.impact = i;
  const f = g("fFeel"); if(f !== undefined) draft.feel = f;
  const t = g("fTime"); if(t !== undefined) draft.time = t;
  const gs = document.getElementById("fGuess"); if(gs) draft.guess = gs.checked;
}

function applyStop(r){
  r.endAt = new Date().toISOString();
  const mins = Math.round((new Date(r.endAt) - new Date(r.startAt)) / 60000);
  r.dur = mins <= 7 ? "数分"
        : mins <= 12 ? "10分前後"
        : mins <= 20 ? "15分前後"
        : mins <= 45 ? "30分程度"
        : mins <= 90 ? "1時間前後"
        : mins <= 300 ? "数時間" : "ほぼ一日中";
  if(!r.fact) r.fact = "（所要 約" + mins + "分）";
  else r.fact += "\n（所要 約" + mins + "分）";
}

async function saveRecord(keepOpen){
  const isNew = !!draft._isNew;
  let target = curDate;
  if(draft.band === "late" && draft.nextDay){
    target = shiftDay(curDate, 1);
    draft.movedFromLate = true;
  }else{
    draft.movedFromLate = false;
  }
  const rec = JSON.parse(JSON.stringify(draft));
  delete rec._isNew;
  delete rec.nextDay;
  if(!isNew){
    rec.editedAt = new Date().toISOString();
    rec.editCount = (rec.editCount || 0) + 1;
  }

  let ok = true;
  if(target === curDate){
    const i = day.records.findIndex(r => r.id === rec.id);
    if(i >= 0) day.records[i] = rec; else day.records.push(rec);
    ok = await saveDay();
  }else{
    /* 日付をまたぐ移動は「先に書いて、書けたら消す」順序にする。
       中止するかどうかは、操作を始める前に端末へ保存できていたかで決める。 */
    const wasPersistent = persistent();
    const other = (await sGet(DKEY(target))) || { note:"", presence:null, records:[] };
    other.records.push(rec);
    const okOther = await sSet(DKEY(target), other);
    if(!okOther && wasPersistent){
      toast("翌日側に保存できなかった。記録はこの日に残してある。");
      return;
    }
    day.records = day.records.filter(r => r.id !== rec.id);
    ok = (await saveDay()) && okOther;
  }

  render();
  if(keepOpen){
    draft = JSON.parse(JSON.stringify(rec));
    draft._isNew = false;
    drawRecordSheet();
    toast(saveMsg(ok, "時間を測り始めた"));
  }else{
    closeSheet();
    toast(saveMsg(ok, target === curDate ? "保存した" : "翌日の記録として保存した"));
  }
}

/* ---------- カテゴリ編集 ---------- */
function openCatEditor(cat){

                : { id:uid(), name:"", color:PALETTE[cats.length % PALETTE.length], measure:false, tags:[] };

  h += '<div class="sec"><span class="seclab">色</span><div class="chips" id="colChips">';

    h += '<button class="chip' + (c.color===p ? " on":"") + '" data-p="' + p + '" style="width:44px;height:36px;background:'

  h += '<div class="sec"><span class="seclab">内容の選択肢（改行で区切る。空でもいい）</span>';
  h += '<textarea class="fld" id="cTags" placeholder="よく使う言い回しを並べておくと、記録が速くなる。">'
     + esc((c.tags||[]).join("\n")) + "</textarea></div>";
  h += '<div class="sec"><label class="check"><input type="checkbox" id="cMeasure"' + (c.measure ? " checked":"")
     + '>所要時間を測る（開始と終了をボタンで打刻できる）</label></div>';
  h += '<div class="acts"><button class="btn sub" id="cCancel">やめる</button><button class="btn" id="cSave">保存</button></div>';
  if(!isNew) h += '<div class="acts" style="margin-top:9px"><button class="btn dgr" id="cDel">この項目を削除</button></div>'
     + '<div class="meta">項目を削除しても、その項目で書いた記録は消えない。</div>';
  openSheet(h);

  document.getElementById("shX").onclick = closeSheet;
  document.getElementById("cCancel").onclick = closeSheet;
  document.getElementById("colChips").onclick = e=>{
    const b = e.target.closest("[data-p]"); if(!b) return;
    c.color = b.dataset.p;
    [...document.getElementById("colChips").children].forEach(x=>{ x.style.outline = "none"; });
    b.style.outline = "2px solid var(--ink)"; b.style.outlineOffset = "2px";
  };
  document.getElementById("cSave").onclick = async ()=>{
    const name = document.getElementById("cName").value.trim();
    if(!name){ toast("名前を入れて"); return; }
    c.name = name;
    c.measure = document.getElementById("cMeasure").checked;
    c.tags = document.getElementById("cTags").value.split("\n").map(s=>s.trim()).filter(Boolean);
    const i = cats.findIndex(x => x.id === c.id);
    if(i >= 0) cats[i] = c; else cats.push(c);
    const ok = await saveCats();
    drawQuick(); render(); closeSheet(); toast(saveMsg(ok, "保存した"));
  };
  const cd = document.getElementById("cDel");
  if(cd){
    let armed = false;
    cd.onclick = async ()=>{
      if(!armed){ armed = true; cd.textContent = "もう一度押すと削除される"; setTimeout(()=>{ armed=false; cd.textContent="この項目を削除"; },4000); return; }
      cats = cats.filter(x => x.id !== c.id);
      const okDel = await saveCats();
      drawQuick(); render(); closeSheet(); toast(saveMsg(okDel, "削除した"));
    };
  }
}

/* ---------- 設定 ---------- */
function openSettings(){
  let h = '<div class="shead"><h2>設定</h2><button class="x" id="shX">✕</button></div>';

  h += '<div class="sec"><span class="seclab">記録する項目</span><div class="list" id="catList">';
  if(!cats.length){
    h += '<div class="li"><span class="grow" style="color:var(--ink3);font-size:.8rem">まだ項目がない。下の「追加」から作れる。</span></div>';
  }
  cats.forEach(c=>{
    h += '<div class="li"><span class="cdot" style="width:9px;height:9px;border-radius:50%;background:'
       + esc(c.color) + '"></span><span class="grow">' + esc(c.name)
       + '<span class="mini">' + (c.tags && c.tags.length ? esc(c.tags.join("・")) : "選択肢なし")
       + (c.measure ? "／所要時間を測る" : "") + "</span></span>";
    h += '<button data-edit="' + esc(c.id) + '">編集</button></div>';
  });
  h += '</div><div style="margin-top:9px"><button class="btn sub" id="addCat">項目を追加</button></div></div>';

  h += '<div class="sec"><span class="seclab">書き出し</span>';
  h += '<div class="row2"><button class="btn sub" id="expCsv">CSV（Excel用）</button>'
     + '<button class="btn sub" id="expJson">JSON（引き継ぎ用）</button></div>';
  h += '<div class="hint">CSVはExcelでそのまま開ける形式で出る。JSONは端末を移すときや、まるごと戻すときに使う。月に一度は書き出して控えを取っておくのが安全。</div></div>';

  h += '<div class="sec"><span class="seclab">読み込み（JSON）</span>';
  h += '<textarea class="fld" id="impBox" style="min-height:64px" placeholder="書き出したJSONを貼り付ける。"></textarea>';
  h += '<div style="margin-top:8px"><button class="btn dgr" id="impBtn">読み込む（いまのデータに上書き）</button></div>';
  h += '<div class="hint">中身を確かめてから書き込む。入れ替える直前に、いまのデータを控えのファイルとして自動で書き出す。</div></div>';

  h += '<div class="sec"><span class="seclab">パスコード</span>';
  h += settings.passcode
     ? '<button class="btn sub" id="pcOff">パスコードを解除する</button>'
     : '<div class="row2"><input class="fld" id="pcNew" inputmode="numeric" maxlength="4" placeholder="4桁の数字"><button class="btn sub" id="pcSet" style="flex:0 0 auto">設定</button></div>';
  h += '<div class="hint">開いたときに数字を求める簡単な目隠し。中のデータ自体は暗号化されないから、本気で調べる相手に対する防御にはならない。その前提で使うもの。</div></div>';

  h += '<div class="meta">保存先：' + (STORE === "memory" ? "この画面を閉じると消える一時領域" : "この端末の中だけ")
     + "<br>外部への通信は行わない。</div>";

  openSheet(h);
  document.getElementById("shX").onclick = closeSheet;
  document.getElementById("addCat").onclick = () => openCatEditor(null);
  document.getElementById("catList").onclick = e=>{
    const b = e.target.closest("[data-edit]"); if(!b) return;
    openCatEditor(cats.find(c => c.id === b.dataset.edit));
  };
  document.getElementById("expCsv").onclick = exportCsv;
  document.getElementById("expJson").onclick = exportJson;
  document.getElementById("impBtn").onclick = doImport;
  const ps = document.getElementById("pcSet");
  if(ps) ps.onclick = async ()=>{
    const v = document.getElementById("pcNew").value.replace(/\D/g,"");
    if(v.length !== 4){ toast("4桁の数字で"); return; }
    settings.passcode = v;
    const ok = await saveSettings(); closeSheet(); toast(saveMsg(ok, "パスコードを設定した"));
  };
  const po = document.getElementById("pcOff");
  if(po) po.onclick = async ()=>{ settings.passcode = null;
    const ok = await saveSettings(); closeSheet(); toast(saveMsg(ok, "解除した")); };
}

/* ---------- 書き出し / 読み込み ---------- */
async function collectAll(){
  const keys = await sKeys("log:day:");
  const days = {};
  for(const k of keys){
    const d = await sGet(k);
    if(d) days[k.replace("log:day:","")] = d;
  }
  return { version:1, exportedAt:new Date().toISOString(), cats, days };
}
function download(name, text, mime){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function csvCell(v){
  const s = String(v ?? "");
  return '"' + s.replace(/"/g,'""') + '"';
}
async function exportCsv(){
  const all = await collectAll();
  const head = ["日付","曜日","在宅","時間帯","時刻","項目","内容","事実","発言","影響","所感",
                "推測","評価","回数","所要時間","記録日時","編集日時","編集回数","種別"];
  const rows = [head.map(csvCell).join(",")];
  const dates = Object.keys(all.days).sort();
  dates.forEach(dt=>{
    const w = ["日","月","火","水","木","金","土"][parseYmd(dt).getDay()];
    const d = all.days[dt];
    const pr = d.presence ? PRESNAME[d.presence] : "";
    const recs = (d.records||[]).slice().sort((a,b)=>{
      const ba = BANDS.findIndex(x=>x.k===a.band), bb = BANDS.findIndex(x=>x.k===b.band);
      if(ba !== bb) return ba - bb;
      return (a.time||"99:99").localeCompare(b.time||"99:99");
    });
    recs.forEach(r=>{
      const c = (all.cats.find(x=>x.id===r.catId) || {name:""});
      rows.push([
        dt, w, pr, BANDNAME[r.band]||"", r.time||"", c.name, (r.tags||[]).join("・"),
        r.fact||"", r.quote||"", r.impact||"", r.feel||"",
        r.guess ? "推測" : "", r.eval==="minus"?"マイナス":r.eval==="plus"?"プラス":"中立",
        r.count||"", r.dur||"", fmtStamp(r.createdAt), fmtStamp(r.editedAt),
        r.editCount||0, "記録"
      ].map(csvCell).join(","));
    });
    if(d.note && d.note.trim()){
      rows.push([dt, w, pr, "", "", "", "", d.note, "", "", "", "", "", "", "", "", "", "", "この日のまとめ"]
        .map(csvCell).join(","));
    }else if(!recs.length && pr){
      /* 記録はないが在宅だけ入っている日も、空白の日と区別できるよう1行残す */
      rows.push([dt, w, pr, "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "記録なし"]
        .map(csvCell).join(","));
    }
  });
  download("log-" + ymd(new Date()) + ".csv", "\uFEFF" + rows.join("\r\n"), "text/csv;charset=utf-8");
  toast("CSVを書き出した");
}
async function exportJson(){
  const all = await collectAll();
  download("log-" + ymd(new Date()) + ".json", JSON.stringify(all, null, 1), "application/json");
  toast("JSONを書き出した");
}
/* 読み込むデータが本当にこのアプリのものか、書き込む前に確かめる。
   ここを通らないものは一切書き込まない。 */
function validateBundle(d){
  if(!d || typeof d !== "object" || Array.isArray(d)) return "このアプリの書き出しファイルではないみたい。";
  if(d.version !== 1) return "対応していない版数のデータだった（version: " + String(d.version) + "）。";
  if(!d.days || typeof d.days !== "object" || Array.isArray(d.days)) return "日付のデータが見つからない。";
  if("cats" in d && !Array.isArray(d.cats)) return "項目のデータの形式が違う。";
  const dates = Object.keys(d.days);
  for(const k of dates){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return "日付の形式が違う：" + k;
    const v = d.days[k];
    if(!v || typeof v !== "object" || Array.isArray(v)) return "この日のデータが壊れている：" + k;
    if(!Array.isArray(v.records)) return "記録が配列になっていない：" + k;
    for(const r of v.records){
      if(!r || typeof r !== "object" || !r.id) return "記録の形式が違う：" + k;
    }
  }
  return null;
}
function normalizeDay(v){
  return {
    note: typeof v.note === "string" ? v.note : "",
    presence: v.presence || null,
    records: v.records.map(r => Object.assign({ tags:[], eval:"neutral" }, r))
  };
}

let impArmed = false;
async function doImport(){
  const btn = document.getElementById("impBtn");
  const txt = document.getElementById("impBox").value.trim();
  if(!txt){ toast("貼り付けてから押して"); return; }

  let data;
  try{ data = JSON.parse(txt); }catch(e){ toast("JSONとして読めなかった"); return; }
  const bad = validateBundle(data);
  if(bad){ toast(bad); return; }

  if(!impArmed){
    impArmed = true;
    btn.textContent = "もう一度押すと入れ替わる（先に控えが落ちる）";
    setTimeout(()=>{
      impArmed = false;
      const b2 = document.getElementById("impBtn");
      if(b2) b2.textContent = "読み込む（いまのデータに上書き）";
    }, 6000);
    return;
  }

  /* ① いまのデータを先にファイルとして手元へ落とす */
  const before = await collectAll();
  const hasSomething = Object.keys(before.days).length || before.cats.length;
  if(hasSomething){
    download("log-戻す用-" + ymd(new Date()) + ".json", JSON.stringify(before, null, 1), "application/json");
  }

  /* ② 新しいデータを書き込む。ここで失敗したら削除には進まない。
     中止の判断は、操作を始める前に端末へ保存できていたかで決める。 */
  const wasPersistent = persistent();
  const newDates = Object.keys(data.days);
  const failed = [];
  for(const dt of newDates){
    const ok = await sSet(DKEY(dt), normalizeDay(data.days[dt]));
    if(!ok) failed.push(dt);
  }
  if(failed.length && wasPersistent){
    toast("書き込めなかった日がある（" + failed.length + "日分）。古いデータは消していない。");
    return;
  }

  /* ③ 書き込めたので、新データに含まれない古い日付だけを消す */
  const keep = new Set(newDates.map(DKEY));
  for(const k of await sKeys("log:day:")){
    if(!keep.has(k)) await sDel(k);
  }
  cats = data.cats || [];
  const okCats = await saveCats();

  await loadDay(); drawQuick(); closeSheet();
  toast(saveMsg(okCats && !failed.length, "読み込んだ"
    + (hasSomething ? "（入れ替え前の控えも書き出した）" : "")));
}

/* ---------- パスコード画面 ---------- */
function showGate(){
  const gate = document.getElementById("gate");
  gate.classList.add("on");
  let buf = "";
  const dots = document.getElementById("gDots");
  const msg = document.getElementById("gMsg");
  const draw = ()=>{
    dots.innerHTML = [0,1,2,3].map(i => '<span class="dot' + (i < buf.length ? " f":"") + '"></span>').join("");
  };
  draw();
  const pad = document.getElementById("gPad");
  pad.innerHTML = [1,2,3,4,5,6,7,8,9,"",0,"⌫"]
    .map(n => n === "" ? "<span></span>" : '<button data-n="' + n + '">' + n + "</button>").join("");
  pad.onclick = e=>{
    const b = e.target.closest("[data-n]"); if(!b) return;
    const n = b.dataset.n;
    if(n === "⌫"){ buf = buf.slice(0,-1); draw(); return; }
    if(buf.length >= 4) return;
    buf += n; draw();
    if(buf.length === 4){
      if(buf === settings.passcode){ gate.classList.remove("on"); }
      else{ msg.textContent = "違う番号だった"; buf = ""; setTimeout(()=>{ draw(); msg.textContent=""; }, 700); }
    }
  };
}

let noteTimer;
document.getElementById("dayNote").oninput = e=>{
  day.note = e.target.value;
  clearTimeout(noteTimer);
  document.getElementById("noteSave").textContent = "…";
  noteTimer = setTimeout(async ()=>{
    const ok = await saveDay();
    const lab = document.getElementById("noteSave");
    if(!lab) return;
    lab.textContent = ok ? "保存済み" : "保存できなかった";
    if(ok) setTimeout(()=>{ const n = document.getElementById("noteSave"); if(n) n.textContent = ""; }, 1600);
  }, 700);

/* ---------- init ---------- */
(async ()=>{
  await initStorage();
  await loadSettings();
  if(settings.passcode) showGate();
  await loadCats();
  drawQuick();
  await loadDay();
  if(STORE === "memory"){
    showStorNote("この環境では記録が保存できない。画面を閉じると消えるから、試しに触るだけにしておいて。");
  }else if(location.protocol === "file:" || location.protocol === "blob:" || location.hostname === ""){
    /* 書き込みは通るが閉じると領域ごと消える環境がある。
       セッション内では検出できないため、置き場所から推定して注意を出す。 */
    showStorNote("いまの開き方では、閉じたときに記録が消える可能性がある。サイトとして公開した場所から開くと保存が続く。");
  }
})();
